name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: the achilles devDependency's postinstall registers
      # agent hooks and skills outside the repo. CI needs the test framework,
      # not the authoring harness.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite
        run: npx playwright test
        env:
          # Unset here on purpose: CI exercises the cold-clone path, where the
          # suite mints its own account through the real signup flow rather
          # than relying on a configured one.
          BASE_URL: https://app.sb036c506.demo.shiftbase.co

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
