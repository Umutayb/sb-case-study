name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # --ignore-scripts: the achilles devDependency's postinstall registers
      # agent hooks and skills outside the repo. CI needs the test framework,
      # not the authoring harness.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The suite proper. This gates the build: a failure here is a regression.
      - name: Run E2E suite
        run: npm run test:no-defects
        env:
          # Unset here on purpose: CI exercises the cold-clone path, where the
          # suite mints its own account through the real signup flow rather
          # than relying on a configured one.
          BASE_URL: https://app.sb036c506.demo.shiftbase.co

      # The known-defect tests are expected to fail while the bug is live, so
      # they report rather than block — a permanently red pipeline stops being
      # read. When signup starts enforcing email uniqueness this step turns
      # green and can be folded into the step above.
      - name: Known defects (reporting only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx playwright test --grep @known-defect
        env:
          BASE_URL: https://app.sb036c506.demo.shiftbase.co

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
